[project]
name = "optiz-qwen"
version = "0.1.0"
description = "Competition workspace for Qwen3.5-2B VLM optimization on PPU."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dndx-public = [
    "torch",
    "torchvision",
    "transformers @ git+https://github.com/huggingface/transformers.git@main",
    "Pillow",
    "numpy",
    "tiktoken",
]
local-dev = [
    "modelscope",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"optiz_qwen.ppu" = ["csrc/*.cpp", "csrc/*.cu"]
